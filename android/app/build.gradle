plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tsunamidam.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.tsunamidam.game"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
